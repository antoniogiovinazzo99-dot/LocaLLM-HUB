name: validate
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Valida risultati e indici aggiornati
        run: |
          python tools/build.py
          git diff --exit-code -- results/ || (echo "Gli index.json non sono aggiornati: esegui python tools/build.py e rifai commit" && exit 1)
